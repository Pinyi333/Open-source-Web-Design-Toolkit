name: Bug report
description: Something is broken or gives the wrong answer
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Color Extractor
        - Typography Analyzer
        - Responsive Tester
        - The site itself (navigation, theme, layout)
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I analyzed https://example.com and it reported 3 font families,
        but the page only uses one.
    validations:
      required: true

  - type: input
    id: input
    attributes:
      label: What did you give it?
      description: >
        The URL you analyzed, or a description of the image. This is usually
        the single most useful detail in the report. Leave it out if it is not
        something you can share.
      placeholder: https://example.com

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on macOS 15
    validations:
      required: true

  - type: dropdown
    id: how-running
    attributes:
      label: How are you running it?
      options:
        - The hosted copy
        - Self-hosted with npm run dev
        - Self-hosted production build
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Anything in the browser console?
      description: Optional, but errors there usually point straight at the cause.
      render: text
